# Trino catalog "lab": the Iceberg connector pointed at the Polaris REST catalog.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lab
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=root:secret
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL

# Data files live on RustFS (S3 API).
fs.native-s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=labadmin
s3.aws-secret-key=labpassword

# Lab only: let expire_snapshots remove snapshots younger than the 7-day default.
iceberg.expire-snapshots.min-retention=0s
